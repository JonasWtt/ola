version: '3.8'

services:
  gemma-2-9b-vllm:
    image: vllm/vllm-openai:latest
    container_name: gemma-2-9b-vllm
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: [
      "--model", "google/gemma-2-9b-it-awq",
      "--quantization", "awq",
      "--gpu-memory-utilization", "0.9",
      "--max-model-len", "4096",
      "--dtype", "auto",
      "--tensor-parallel-size", "1"
    ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
